function rc(){cmn.textContent=SCE.monthName(calM)+" "+calY+" هـ";var fg=SCE.h2g(calY,calM,1);var dim=SCE.daysInMonth(calY,calM);var lg=SCE.h2g(calY,calM,dim);cgr.textContent=fg.toLocaleDateString("ar-SA",{month:"short"})+" "+fg.getFullYear()+" - "+lg.toLocaleDateString("ar-SA",{month:"short"})+" "+lg.getFullYear();cdg.innerHTML="";var sd=fg.getDay();for(var i=0;i<sd;i++){cdg.appendChild(document.createElement("div"));}var tH=SCE.hijri(new Date());for(var d=1;d<=dim;d++){var cell=document.createElement("div");cell.textContent=d;var cls="cal-day ";if(d===tH.hDay&&calM===tH.hMonth&&calY===tH.hYear)cls+="today";else cls+="normal";for(var s=0;s<sDays.length;s++){if(sDays[s].m===calM&&sDays[s].d===d){cls+=sDays[s].t==="sorrow"?" special-sorrow":" special-joy";}}cell.className=cls;cdg.appendChild(cell);}}
function ua(){uc();rp();var tH=SCE.hijri(new Date());thj.textContent=tH.hDay+" "+SCE.monthName(tH.hMonth)+" "+tH.hYear+" هـ";if(calY===0){calY=tH.hYear;calM=tH.hMonth;}rc();}
